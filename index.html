<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, I'm Sammy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #f5f7ff, #ffffff); color: #222; }
        nav { width: 100%; padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #635bff; }
        .status { font-size: 14px; color: #777; }
        .hero { max-width: 1000px; margin: auto; padding: 60px 20px 40px; text-align: center; }
        .profile-photo { width: 180px; height: 180px; object-fit: cover; border-radius: 50%; border: 6px solid white; box-shadow: 0 15px 40px rgba(0,0,0,0.15); margin-bottom: 30px; }
        .hero h1 { font-size: clamp(45px, 8vw, 80px); margin-bottom: 20px; }
        .hero h1 span { color: #635bff; }
        .hero p { max-width: 600px; margin: auto; color: #666; font-size: 18px; line-height: 1.7; }
        .form-section { max-width: 600px; margin: 30px auto 80px; padding: 20px; }
        .form-card { background: white; padding: 35px; border-radius: 24px; box-shadow: 0 15px 50px rgba(0,0,0,0.08); }
        .form-card h2 { margin-bottom: 10px; }
        .form-card .description { color: #777; margin-bottom: 30px; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group { margin-bottom: 22px; }
        input, select, textarea { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; outline: none; background: white; }
        input:focus, select:focus, textarea:focus { border-color: #635bff; }
        textarea { min-height: 100px; resize: vertical; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option { border: 1px solid #ddd; border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; }
        .option:hover { border-color: #635bff; }
        .option input { width: auto; margin-right: 8px; }
        .location-box { background: #f5f5ff; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; }
        .location-status { color: #666; }
        .location-button { margin-top: 10px; background: white; border: 1px solid #635bff; color: #635bff; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .submit-button { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #635bff; color: white; font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .submit-button:hover { background: #5148d8; transform: translateY(-2px); }
        #result { margin-top: 20px; text-align: center; font-weight: bold; }
        footer { text-align: center; padding: 30px; color: #888; font-size: 14px; }
        @media (max-width: 600px) {
            .form-card { padding: 25px 20px; }
            .options { grid-template-columns: 1fr; }
            .profile-photo { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">SAMMY</div>
        <div class="status">Nice to meet you 👋</div>
    </nav>

    <section class="hero">
        <img src="sammy.jpg" alt="Sammy" class="profile-photo">
        <h1>Hi, I am <span>Sammy</span>.</h1>
        <p>Want to know me better? Tell me a little about yourself and what kind of connection you're looking for.</p>
    </section>

    <section class="form-section">
        <div class="form-card">
            <h2>Let's get to know each other</h2>
            <p class="description">Fill in the details below and I'll get back to you.</p>
            <form id="contactForm" action="https://formsubmit.co/samgoh3601@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New Contact From Sammy Website">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="Name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="Email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="sex">Sex</label>
                    <select id="sex" name="Sex">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>What are you looking for?</label>
                    <div class="options">
                        <label class="option"><input type="radio" name="Looking For" value="Going Out" required> Going Out 🍜</label>
                        <label class="option"><input type="radio" name="Looking For" value="Chat"> Chat 💬</label>
                        <label class="option"><input type="radio" name="Looking For" value="Friendship"> Friendship 🤝</label>
                        <label class="option"><input type="radio" name="Looking For" value="Something Else"> Something Else ✨</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Tell me something about yourself</label>
                    <textarea id="message" name="Message" placeholder="Write something..."></textarea>
                </div>
                <div class="form-group">
                    <label>Your Location</label>
                    <div class="location-box">
                        <div class="location-status" id="locationStatus">Location has not been shared.</div>
                        <button type="button" class="location-button" id="locationButton">📍 Share My Location</button>
                    </div>
                </div>
                <input type="hidden" name="Latitude" id="latitude">
                <input type="hidden" name="Longitude" id="longitude">
                <button type="submit" class="submit-button">Send My Details 💌</button>
            </form>
            <div id="result"></div>
        </div>
    </section>

    <footer>© 2026 Sammy. All rights reserved.</footer>

    <script>
        const locationButton = document.getElementById("locationButton");
        const locationStatus = document.getElementById("locationStatus");
        const latitudeInput = document.getElementById("latitude");
        const longitudeInput = document.getElementById("longitude");

        locationButton.addEventListener("click", function () {
            if (!navigator.geolocation) {
                locationStatus.textContent = "Your browser does not support location.";
                return;
            }
            locationStatus.textContent = "Requesting your permission...";
            navigator.geolocation.getCurrentPosition(
                function (position) {
                    latitudeInput.value = position.coords.latitude;
                    longitudeInput.value = position.coords.longitude;
                    locationStatus.textContent = "Location shared successfully 📍";
                    locationButton.textContent = "✓ Location Shared";
                },
                function () {
                    locationStatus.textContent = "Location permission was not granted.";
                }
            );
        });

        document.getElementById("contactForm").addEventListener("submit", function () {
            document.getElementById("result").textContent = "Sending your details... 💌";
        });
    </script>
</body>
</html>
